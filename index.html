<script>
const P=JSON.parse(document.getElementById("payload").textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"])}
const open=(k,e)=>crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},k,b64(e.ct));
async function unlock(pw){const k=await keyFor(pw);const g=new TextDecoder().decode(await open(k,P.guide));
 document.getElementById("lock").remove();document.getElementById("content").innerHTML=g;
 const btn=document.getElementById("dl");if(btn)btn.onclick=async()=>{const data=await open(k,P.file);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/javascript"}));a.download=P.name;a.click()};
 try{sessionStorage.setItem("cbpw",pw)}catch(e){}}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();document.getElementById("err").textContent="";
 try{await unlock(document.getElementById("pw").value)}catch(err){document.getElementById("err").textContent="Wrong password."}};
try{const s=sessionStorage.getItem("cbpw");if(s)unlock(s).catch(()=>{})}catch(e){}
</script></body></html>
